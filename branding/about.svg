<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
  <!-- GoOffice About dialog artwork -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e2b45"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d482"/>
      <stop offset="1" stop-color="#009e60"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#00b36b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#00b36b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="640" fill="url(#bg)"/>
  <rect width="720" height="640" fill="url(#glow)"/>
  <!-- soft grid of dots -->
  <g fill="#3b4a66" opacity="0.35">
    <circle cx="120" cy="120" r="3"/><circle cx="240" cy="120" r="3"/><circle cx="600" cy="120" r="3"/>
    <circle cx="120" cy="520" r="3"/><circle cx="600" cy="520" r="3"/><circle cx="660" cy="240" r="3"/>
    <circle cx="60" cy="300" r="3"/><circle cx="672" cy="420" r="3"/><circle cx="48" cy="440" r="3"/>
  </g>
  <!-- document mark -->
  <g>
    <rect x="264" y="150" width="192" height="192" rx="44" fill="url(#mark)"/>
    <rect x="300" y="204" width="120" height="14" rx="7" fill="#ffffff" opacity="0.92"/>
    <rect x="300" y="238" width="120" height="14" rx="7" fill="#ffffff" opacity="0.75"/>
    <rect x="300" y="272" width="74" height="14" rx="7" fill="#ffffff" opacity="0.58"/>
    <path d="M 338 262 l 46 30 l -46 30 v -18 l 19 -12 l -19 -12 z" fill="#ffffff"/>
  </g>
  <text x="360" y="430" text-anchor="middle" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="64" font-weight="bold">
    <tspan fill="#3ee08f">Go</tspan><tspan fill="#f1f5f9">Office</tspan>
  </text>
  <text x="360" y="476" text-anchor="middle" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="22" fill="#94a3b8">The open office suite</text>
  <rect x="280" y="508" width="160" height="4" rx="2" fill="#00b36b" opacity="0.8"/>
</svg>
