<svg xmlns="http://www.w3.org/2000/svg" width="345" height="72" viewBox="0 0 345 72">
  <!-- GoOffice logo: mark + wordmark (light background version) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00c176"/>
      <stop offset="1" stop-color="#009e60"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="4" y="6" width="60" height="60" rx="14" fill="url(#g)"/>
    <!-- document lines -->
    <rect x="18" y="22" width="32" height="5" rx="2.5" fill="#ffffff" opacity="0.92"/>
    <rect x="18" y="33" width="32" height="5" rx="2.5" fill="#ffffff" opacity="0.75"/>
    <rect x="18" y="44" width="20" height="5" rx="2.5" fill="#ffffff" opacity="0.58"/>
    <!-- go chevron -->
    <path d="M 40 40 l 12 8 l -12 8 v -5 l 5 -3 l -5 -3 z" fill="#ffffff"/>
  </g>
  <text x="78" y="52" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="40" font-weight="bold" fill="#00b36b">Go</text>
  <text x="136" y="52" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="40" font-weight="bold" fill="#334155">Office</text>
</svg>
