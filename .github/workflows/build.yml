name: Build GoOffice

# Builds GoOffice installers on free GitHub-hosted runners (public repo):
#   - macOS arm64 + x64 (DMG) — macos-15 runners (x64 = cross-compile)
#   - Linux arm64 (deb)      — ubuntu-24.04-arm runner
#   - Windows x64 + arm64 (MSI) — windows-2022 runner (arm64 cross from x64)
# The dispatch `platforms` input selects jobs (empty = all).
#
# NOTE on duration: a full LibreOffice build on 2–4 vCPU free runners takes
# 4–8h which can exceed the 6h job limit. Strategy:
#   1. lean config (no LTO, minimal langs, --disable-odk on Windows CI),
#   2. ccache cached across attempts (macOS/Linux) — re-run a timed-out job:
#      the second run reuses compiled objects and finishes.
#   3. Windows has no ccache for MSVC — lean config only; a strong local
#      machine remains the fast path for Windows rebuilds.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma list to build (empty = all): macos-arm64, macos-x64-cross, linux-arm64, win-x64, win-arm64'
        required: false
        default: ''
  push:
    tags: ['v*']

env:
  LO_TAG: libreoffice-26.8.2.2
  GOOFFICE_VERSION: '1.0.0'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    # workflow_dispatch: build only the requested platforms (empty input = all);
    # tag pushes build everything
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == '' || contains(inputs.platforms, matrix.platform) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, os: macos-15,   input: macos-arm64.input }
          - { platform: macos-x64,   os: macos-13,   input: macos-x64.input }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, input: linux-arm64.input }
          # Intel DMG cross-built on an arm64 runner: GitHub's Intel runners
          # (macos-13) are no longer obtainable on the free tier
          - { platform: macos-x64-cross, os: macos-15, input: macos-x64-cross.input }
          # Windows: 4-core runner, no ccache for MSVC — first cold build may
          # hit the 350-min limit; CI appends --disable-odk to slim the build.
          # The strong local machine remains the fast path for Windows.
          - { platform: win-x64,   os: windows-2022, input: win-x64.input }
          - { platform: win-arm64, os: windows-2022, input: win-arm64.input }

    steps:
      - name: Checkout GoOffice repo (branding + configs)
        uses: actions/checkout@v4

      - name: Clone LibreOffice source (${{ env.LO_TAG }})
        shell: bash
        run: |
          git clone --depth 1 --branch "$LO_TAG" --config core.autocrlf=false https://github.com/LibreOffice/core "$RUNNER_TEMP/core"
          cd "$RUNNER_TEMP/core"
          git config core.autocrlf false
          # Vietnamese UI support: the build needs the translations repo
          # (vi .po -> .mo) and dictionaries (spellcheck .dic) as siblings.
          # Without them the installer packaging step fails with hundreds of
          # "Source for <file> not found" errors.
          clone_lo_repo() {
            local name="$1"
            git clone --depth 1 --branch "$LO_TAG" "https://github.com/LibreOffice/$name" "$name" \
              || git clone --depth 1 "https://github.com/LibreOffice/$name" "$name"
          }
          clone_lo_repo translations
          clone_lo_repo dictionaries
          git -c core.autocrlf=false -c user.name=GoOfficeCI -c user.email=ci@gooffice.local apply --ignore-whitespace \
            "$GITHUB_WORKSPACE/patches/0001-wsl-aware-branding-path.patch" \
            "$GITHUB_WORKSPACE/patches/0002-gooffice-product-blocks-in-openoffice-lst.patch" \
            "$GITHUB_WORKSPACE/patches/0003-gooffice-msi-guids.patch" \
            "$GITHUB_WORKSPACE/patches/0004-gooffice-in-sysui-productlist.patch" \
            "$GITHUB_WORKSPACE/patches/0005-wsl-cross-configure-fixes.patch" \
            "$GITHUB_WORKSPACE/patches/0006-gooffice-wnt-cross-gbuild-fixes.patch" \
            "$GITHUB_WORKSPACE/patches/0007-macos-cross-appleremote.patch" \
            "$GITHUB_WORKSPACE/patches/0008-gooffice-productname-resource-and-dir.patch" \
            "$GITHUB_WORKSPACE/patches/0009-gooffice-app-icon.patch" \
            "$GITHUB_WORKSPACE/patches/0010-gooffice-linux-macos-icons.patch" \
            "$GITHUB_WORKSPACE/patches/0011-fix-installer-empty-sourcepath.patch" \
            "$GITHUB_WORKSPACE/patches/0012-gooffice-default-vietnamese.patch" \
            "$GITHUB_WORKSPACE/patches/0013-gooffice-installer-instdir-fallback.patch" \
            "$GITHUB_WORKSPACE/patches/0014-gooffice-vnd-currency-symbol.patch" \
            "$GITHUB_WORKSPACE/patches/0015-gooffice-remove-donate-ui.patch" \
            "$GITHUB_WORKSPACE/patches/0016-gooffice-call-installer-instdir.patch" \
            "$GITHUB_WORKSPACE/patches/0017-gooffice-installer-debug.patch"
          echo "CORE_DIR=$RUNNER_TEMP/core" >> "$GITHUB_ENV"

      # ---------- platform deps ----------
      - name: Install deps (Linux arm64)
        if: matrix.platform == 'linux-arm64'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config autoconf automake make gperf bison nasm flex \
            zip unzip gettext build-essential python3 python3-dev python3-lxml \
            libgtk-3-dev libglib2.0-dev libdbus-glib-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libcups2-dev libx11-dev libxext-dev libxrender-dev libxrandr-dev libxi-dev \
            libice-dev libsm-dev libfontconfig1-dev libfreetype6-dev \
            openjdk-17-jdk ccache debhelper ant junit4 \
            libkrb5-dev libnss3-dev libnspr4-dev meson ninja-build ragel

      - name: Install deps (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          brew install autoconf automake ccache ant make meson ninja wget gperf python@3.11
          # expose GNU make 4.x as `make` (system make 3.81 is too old for LO)
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"
          brew install --cask temurin@17

      - name: Install deps (Windows x64 + arm64 cross)
        if: startsWith(matrix.platform, 'win-')
        shell: pwsh
        run: |
          $dl = "$env:RUNNER_TEMP\dl"
          New-Item -ItemType Directory -Force -Path $dl | Out-Null
          # same files/checksums as the official winget config + our local setup
          $files = @{
            'make-4.2.1-msvc.exe'                    = 'https://dev-www.libreoffice.org/bin/cygwin/make-4.2.1-msvc.exe'
            'jom_1_1_4.zip'                          = 'http://download.qt.io/official_releases/jom/jom_1_1_4.zip'
            'pkgconf-2.4.3.exe'                      = 'https://dev-www.libreoffice.org/extern/pkgconf-2.4.3.exe'
            'strawberry-perl-5.40.0.1-64bit-portable.zip' = 'https://github.com/StrawberryPerl/Perl-Dist-Strawberry/releases/download/SP_54001_64bit_UCRT/strawberry-perl-5.40.0.1-64bit-portable.zip'
            'apache-ant-1.10.17-bin.zip'             = 'https://archive.apache.org/dist/ant/binaries/apache-ant-1.10.17-bin.zip'
            'junit-4.10.jar'                         = 'https://repo1.maven.org/maven2/junit/junit/4.10/junit-4.10.jar'
          }
          foreach ($k in $files.Keys) {
            Invoke-WebRequest -Uri $files[$k] -OutFile "$dl\$k"
          }
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\bin","$env:USERPROFILE\lo" | Out-Null
          Copy-Item "$dl\make-4.2.1-msvc.exe" "$env:USERPROFILE\bin\make.exe"
          Copy-Item "$dl\pkgconf-2.4.3.exe"   "$env:USERPROFILE\bin\pkgconf-2.4.3.exe"
          Expand-Archive "$dl\jom_1_1_4.zip" "$env:RUNNER_TEMP\jom_unpack" -Force
          Copy-Item "$env:RUNNER_TEMP\jom_unpack\jom.exe" "$env:USERPROFILE\bin\jom.exe"
          Expand-Archive "$dl\apache-ant-1.10.17-bin.zip" "$env:USERPROFILE\lo" -Force
          Expand-Archive "$dl\strawberry-perl-5.40.0.1-64bit-portable.zip" "$env:USERPROFILE\lo\spp" -Force
          Copy-Item "$dl\junit-4.10.jar" "$env:USERPROFILE\lo\"

      # ---------- ccache ----------
      - name: ccache cache
        if: matrix.platform == 'linux-arm64' || startsWith(matrix.platform, 'macos')
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.platform }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.platform }}-
          # keep partial compile results even when the 350-min job limit kills
          # the run: re-running the job then resumes from the restored cache
          save-always: true

      # ---------- configure & build ----------
      - name: Configure (Linux/macOS)
        if: ${{ !startsWith(matrix.platform, 'win-') }}
        shell: bash
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then
            # configure rejects Homebrew's `pkgconf` binary name; hand it the
            # symlinked `pkg-config` path it has an explicit allowlist for
            if [ -x /opt/homebrew/bin/pkg-config ]; then export PKG_CONFIG=/opt/homebrew/bin/pkg-config
            elif [ -x /usr/local/bin/pkg-config ]; then export PKG_CONFIG=/usr/local/bin/pkg-config
            else export PKG_CONFIG=/usr/bin/pkg-config; fi
            # the macOS cross BUILD-side configure re-detects pkg-config from
            # PATH and hits the same origin check; feed it the allowlisted one
            export PKG_CONFIG_FOR_BUILD="$PKG_CONFIG"
            # runner image puts Python.framework first in PATH; brew meson is
            # only compatible with brew's own python
            if [ -x "$(brew --prefix)/bin/python3" ]; then export PYTHON="$(brew --prefix)/bin/python3"; fi
          fi
          cd "$CORE_DIR"
          sed "s|/home/runner/work/gooffice/gooffice/branding|$GITHUB_WORKSPACE/branding|; \
               s|/Users/runner/work/gooffice/gooffice/branding|$GITHUB_WORKSPACE/branding|" \
            "$GITHUB_WORKSPACE/autogen/${{ matrix.input }}" > autogen.input
          if [ "$(uname -s)" = "Darwin" ]; then
            # cross builds run a BUILD-side configure that cannot auto-detect
            # the JDK; patch 0005 forwards this option to it
            JH=$(/usr/libexec/java_home -v 17 2>/dev/null || true)
            if [ -z "$JH" ] && [ -d "$(brew --prefix)/opt/temurin@17/libexec/openjdk.jdk/Contents/Home" ]; then
              JH="$(brew --prefix)/opt/temurin@17/libexec/openjdk.jdk/Contents/Home"
            fi
            if [ -n "$JH" ]; then
              echo "--with-jdk-home=$JH" >> autogen.input
            fi
          fi
          ./autogen.sh

      - name: Configure (Windows x64 + arm64 cross, Git Bash)
        if: startsWith(matrix.platform, 'win-')
        shell: bash
        run: |
          cd "$CORE_DIR"
          # portable-tool PATH: msvc make + jom + pkgconf + strawberry perl + ant
          export PATH="$HOME/bin:$HOME/lo/spp/perl/bin:$HOME/lo/spp/c/bin:$HOME/lo/apache-ant-1.10.17/bin:$PATH"
          mkdir -p /c/lo-externaltar
          sed -e 's|C:/Users/NAM/GoOffice/lo-externaltar|C:/lo-externaltar|' \
              -e 's|C:/Users/NAM/lo/spp|C:/Users/runneradmin/lo/spp|' \
              -e 's|C:/Users/NAM/lo/apache-ant-1.10.17|C:/Users/runneradmin/lo/apache-ant-1.10.17|' \
              -e 's|C:/Users/NAM/lo/junit-4.10.jar|C:/Users/runneradmin/lo/junit-4.10.jar|' \
              -e 's|C:/Users/NAM/GoOffice/tools/jdk17|C:/hostedtoolcache/windows/Java_Temurin-Hotspot_jdk/17|' \
              -e 's|C:/Users/NAM/Desktop/office/branding|'"$(cygpath -m "$GITHUB_WORKSPACE")"'/branding|' \
              -e '/--with-doxygen/d' \
              "$GITHUB_WORKSPACE/autogen/${{ matrix.input }}" > autogen.input
          # slim CI build: ODK (SDK) is the heaviest optional chunk and its MSI
          # does not carry branding changes; skip it to stay under 350 min
          echo "--disable-odk" >> autogen.input
          # runner JDK path discovery (image-provided Temurin 17)
          JDK17="${JAVA_HOME_17_X64:-}"
          if [ ! -d "$JDK17" ]; then
            JDK17=$(ls -d /c/hostedtoolcache/windows/Java_Temurin-Hotspot_jdk/17*/x64 2>/dev/null | head -1)
          fi
          echo "JDK17=$JDK17"
          if [ -n "$JDK17" ]; then
            sed -i "s|C:/hostedtoolcache/windows/Java_Temurin-Hotspot_jdk/17|$(cygpath -m "$JDK17")|" autogen.input
          fi
          ./autogen.sh 2>&1 | tee autogen-ci.log
          # fail hard if packaging prerequisites were rejected
          grep -E "no package format|MSI" autogen-ci.log | head -5 || true

      - name: Build (Linux/macOS)
        if: ${{ !startsWith(matrix.platform, 'win-') }}
        shell: bash
        run: |
          cd "$CORE_DIR"
          if [ "${{ matrix.platform }}" != "win-arm64" ]; then export PATH="/usr/lib/ccache:$PATH"; fi
          make fetch -j"$(nproc)"
          make -j"$(nproc)" || {
            echo "=== GOOFFICE DIAG ==="
            echo "--- config_host INSTDIR/WORKDIR/SRCDIR ---"
            grep -E '^export (INSTDIR|WORKDIR|SRCDIR)=' config_host.mk
            echo "--- instdir state ---"
            ls instdir/ 2>&1 | head
            ls instdir/program/soffice instdir/program/libabplo.so 2>&1
            ls instdir/program/resource/ 2>&1
            echo "--- setup_osl.ins libabplo entry ---"
            grep -B2 -A8 'libabplo' workdir/InstallScriptTarget/setup_osl.ins 2>&1 | head -30
            echo "--- installer log tail ---"
            find workdir/installation -name "log_*.log" -exec tail -50 {} \; 2>/dev/null | head -80
            exit 1
          }

      - name: Build (Windows x64 + arm64 cross)
        if: startsWith(matrix.platform, 'win-')
        shell: cmd
        run: |
          cd /d "%CORE_DIR%"
          set PATH=%USERPROFILE%\bin;%USERPROFILE%\lo\spp\perl\bin;%USERPROFILE%\lo\apache-ant-1.10.17\bin;%PATH%
          make fetch -j8 || exit /b 1
          make -j8 || exit /b 1

      # ---------- artifacts ----------
      - name: Locate installer artifacts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          case "${{ matrix.platform }}" in
            macos-*)   find "$CORE_DIR/workdir/installation" -name "*.dmg" -exec cp {} "$RUNNER_TEMP/out/" \; ;;
            linux-*)   find "$CORE_DIR/workdir/installation" -name "*.deb" -exec cp {} "$RUNNER_TEMP/out/" \; ;;
            win-*)     find "$CORE_DIR/workdir/installation" -name "*.msi" -exec cp {} "$RUNNER_TEMP/out/" \; ;;
          esac
          ls -lh "$RUNNER_TEMP/out"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoOffice-${{ matrix.platform }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.platform }}
          path: ${{ env.CORE_DIR }}/workdir/*.log
          if-no-files-found: ignore
